<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Still Awake</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js" defer></script>
    <script src="p5.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="splash" id="splashScreen">
        <video controls poster="thumbnail.jpg" autoplay muted loop>
        <source src="video/Still Awake.mp4" type="video/mp4">
        Your browser does not support the video tag.
        </video>
    </div>

    <div id="sketch"></div>
    <main>
        <h1>Still Awake</h1>
    </main>
<div class="content-box">

<div class="image-panel">
    <button id="open-panel" aria-label="Open panel">↖</button>

    <div class="panel-image">
        <img src="images/exit.jpeg" alt="Illuminated exit sign">
    </div>
</div>

<section id="next-panel" class="next-panel" aria-hidden="true" inert>
    <button id="close-panel" class="back-arrow" aria-label="Go back">↖</button>

    <div class="next-content">
        <h1>Still Becoming</h1>
        <p>Your content goes here.</p>
    </div>
</section>
</div>

</body>
